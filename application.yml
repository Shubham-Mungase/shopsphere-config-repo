spring:
  datasource:
    username: ${DB_USERNAME:springuser}
    password: ${DB_PASSWORD}

logging:
  level:
    root: INFO

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
